[workspace]
resolver = "2"
members = [
    "crates/ni-proto",
    "crates/ni-game",
    "crates/ni-engine",
    "crates/ni-bot",
    "crates/ni-telemetry",
    "crates/roger-the-shrubber",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/gstew45/ni"

[workspace.dependencies]
ni-proto = { path = "crates/ni-proto" }
ni-game = { path = "crates/ni-game" }
ni-bot = { path = "crates/ni-bot" }
ni-telemetry = { path = "crates/ni-telemetry" }
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "process",
    "time",
    "io-util",
    "signal",
    "sync",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic-build = "0.13"
protoc-bin-vendored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry-appender-tracing = "0.32"
